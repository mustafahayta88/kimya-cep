<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0D1117">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kimya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;overflow-x:hidden;padding-bottom:60px}
#hdr{background:#0D1117;border-bottom:1px solid #333;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
#hdr h1{color:#00F0FF;font-size:18px;font-weight:700}
#hdr span{color:#8B949E;font-size:11px}
#tabs{display:flex;overflow-x:auto;gap:2px;padding:6px 6px 0;background:#0D1117;position:sticky;top:44px;z-index:10;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 10px;border-radius:6px 6px 0 0;font-size:12px;font-weight:600;color:#8B949E;background:transparent;border:none;cursor:pointer;white-space:nowrap;transition:.2s;flex-shrink:0}
.tab.act{color:#00F0FF;background:#161B22}
.tc{display:none;padding:6px}.tc.act{display:block}
canvas{width:100%;height:auto;border-radius:6px;display:block;background:#0D1117;margin-bottom:4px}
.dc{background:#161B22;border:1px solid #333;border-radius:6px;padding:10px;margin-bottom:6px;font-size:12px;line-height:1.5;color:#CCC}
.dc b{color:#00F0FF}.dc .g{color:#39FF14;font-weight:700}.dc .s{color:#AAA;font-size:11px}
input[type=text]{background:#161B22;border:1px solid #333;border-radius:6px;color:#E6EDF3;padding:8px 10px;font-size:13px;width:100%;outline:none}
input[type=text]:focus{border-color:#00F0FF}
button{background:#21262D;border:1px solid #444;border-radius:6px;color:#E6EDF3;padding:6px 12px;font-size:12px;cursor:pointer;transition:.2s}
button:active{background:#333}
.br{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}.br button{flex:1;min-width:50px;font-size:10px;padding:5px 3px;background:#21262D;border:1px solid #444;border-radius:4px}
.br button.sel{background:#00F0FF22;border-color:#00F0FF;color:#00F0FF}
.rb{background:#161B22;border:1px solid #333;border-radius:6px;padding:10px;margin:4px 0;font-size:11px;line-height:1.6}
.rb .l{color:#00F0FF;font-weight:600}.rb .v{color:#39FF14}
#rp{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0}#rp button{flex:1;min-width:48px;font-size:9px;padding:4px 2px;background:#1E2A3A;border:1px solid #444}
</style>
</head>
<body>

<div id="hdr"><h1>Kimya</h1><span id="st">0 element</span></div>

<div id="tabs">
<button class="tab act" data-i="0">Reaksiyon</button>
<button class="tab" data-i="1">Izomeri</button>
<button class="tab" data-i="2">Polimer</button>
<button class="tab" data-i="3">Petrol</button>
<button class="tab" data-i="4">Biyomolekul</button>
<button class="tab" data-i="5">Redoks</button>
</div>

<div class="tc act" id="t0"><canvas id="c0" height="400"></canvas><div class="dc" id="d0">Reaksiyon turu secin</div><div class="br" id="b0"></div></div>
<div class="tc" id="t1"><canvas id="c1" height="400"></canvas><div class="dc" id="d1">Izomeri turu secin</div><div class="br" id="b1"></div></div>
<div class="tc" id="t2"><canvas id="c2" height="400"></canvas><div class="dc" id="d2">Polimer turu secin</div><div class="br" id="b2"></div></div>
<div class="tc" id="t3"><canvas id="c3" height="400"></canvas><div class="dc" id="d3">Petrol turu secin</div><div class="br" id="b3"></div></div>
<div class="tc" id="t4"><canvas id="c4" height="400"></canvas><div class="dc" id="d4">Biyomolekul turu secin</div><div class="br" id="b4"></div></div>
<div class="tc" id="t5"><canvas id="c5" height="360"></canvas>
<div style="display:flex;gap:6px;margin-bottom:4px"><input type="text" id="rx1" placeholder="Element 1"><input type="text" id="rx2" placeholder="Element 2"><button id="rxb">Analiz</button></div>
<div id="rp"></div><div class="rb" id="rxt">Iki element girerek Redoks analizi yapin</div></div>

<script>
// === ELEMENT DATA ===
var EL = {H:{n:'Hidrojen',en:2.20},He:{n:'Helyum',en:0},Li:{n:'Lityum',en:0.98},Be:{n:'Berilyum',en:1.57},B:{n:'Bor',en:2.04},C:{n:'Karbon',en:2.55},N:{n:'Azot',en:3.04},O:{n:'Oksijen',en:3.44},F:{n:'Flor',en:3.98},Ne:{n:'Neon',en:0},Na:{n:'Sodyum',en:0.93},Mg:{n:'Magnezyum',en:1.31},Al:{n:'Aluminyum',en:1.61},Si:{n:'Silisyum',en:1.90},P:{n:'Fosfor',en:2.19},S:{n:'Kukurt',en:2.58},Cl:{n:'Klor',en:3.16},Ar:{n:'Argon',en:0},K:{n:'Potasyum',en:0.82},Ca:{n:'Kalsiyum',en:1.00},Br:{n:'Brom',en:2.96},I:{n:'Iyot',en:2.66}};
document.getElementById('st').textContent = Object.keys(EL).length + ' element';

// === TABS ===
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('act')});
    t.classList.add('act');
    document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('act')});
    document.getElementById('t'+t.dataset.i).classList.add('act');
    setTimeout(drawAll, 50);
  });
});

// === HELPERS ===
var PI = Math.PI, TAU = 2*PI;
function bg(c){c.fillStyle='#0D1117';c.fillRect(0,0,c.canvas.width,c.canvas.height)}
function circ(c,x,y,r,fi,st,sw){
  c.beginPath();c.arc(x,y,r,0,TAU);
  if(fi){c.fillStyle=fi;c.fill()}if(st){c.strokeStyle=st;c.lineWidth=sw||3;c.stroke()}
}
function ln(c,x1,y1,x2,y2,co,w){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=co;c.lineWidth=w||4;c.stroke()}
function at(c,x,y,e,fi,st,sz){
  circ(c,x,y,ar,fi||'#6B6B6B',st||'#444',3);
  c.font=(sz||ar*0.9)+'px -apple-system,system-ui,sans-serif';c.fillStyle='#FFF';c.textAlign='center';c.textBaseline='middle';
  c.fillText(e,x,y)
}
function bl(c,x1,y1,x2,y2,t,c1,c2){ln(c,x1,y1,x2,y2,t===2?(c2||'#00F0FF'):(c1||'#8B949E'),4)}
function arr(c,x1,y1,x2,y2,co){
  ln(c,x1,y1,x2,y2,co||'#39FF14',4);
  var a=Math.atan2(y2-y1,x2-x1);c.beginPath();c.moveTo(x2,y2);
  c.lineTo(x2-14*Math.cos(a-0.4),y2-14*Math.sin(a-0.4));c.lineTo(x2-14*Math.cos(a+0.4),y2-14*Math.sin(a+0.4));c.closePath();c.fillStyle=co||'#39FF14';c.fill()
}
function tx(c,t,x,y,co,sz){
  c.font=(sz||14)+'px -apple-system,system-ui,sans-serif';c.fillStyle=co||'#E6EDF3';c.textAlign='center';c.textBaseline='middle';
  c.fillText(t,x,y)
}

// === DRAW ALL ===
var cur = [0,0,0,0,0,0];
var INFOS = [
  ['Yer Degistirme (SN2): Nu: + R-L -> R-Nu + L. Nu: (OH-, CN-, vs.) ayrilan grubu (L=Cl, Br, I) yerinden cikarir. Tek basamakli, eszamanli.','Katilma (Elektrofilik): C=C cift bagina HX (X=Cl, Br) eklenir. Markovnikov kurali: H cok H'li C'ye gider.','Ayrilma (Eliminasyon): Alkol+H+ -> Alken+H2O. OH protonlanir, H2O ayrilir, cift bag olusur.','Yukseltgenme: Alkol -> Keton/Asit (Cr2O7/H2SO4 ile). R-OH + [O] -> R=O + H2O.','Indirgenme: Keton/Asit -> Alkol (LiAlH4/NaBH4 ile). C=O + 2H -> CH-OH.','Nukleofilik Yer Degistirme (SN1): R-L -> R+ + L- (once), sonra Nu: -> R-Nu. Karbokatyon ara urunu, iki basamakli.'],
  ['Yapi (Yapisal) Izomeri: Ayni formulu farkli yapi. Zincir (butan vs izobutan), konum (1-kloropropan vs 2-kloropropan), fonksiyonel grup (etanol vs dimetileter).','Geometrik (Cis-Trans) Izomeri: C=C cift baginda veya halkali yapida. Cis: ayni tarafta, Trans: karsi tarafta. Siklohekzanol ornegi.','Optik (Enantiyomer) Izomeri: Kiral merkez (4 farkli grup). D-L izomerleri (amino asitler/sekerler). Polarized isigi dondurme. Optikce aktif.','Tautomeria: Protonun yer degistirmesi ile olusan izomeri. Keto-enol tautomerisi (aldehit/keton <-> enol formu).','Konformasyon Izomeri: Tek bag etrafinda donme ile olusan farkli 3D yapilar. Etan: gergin (eclipsed) ve kaymis (staggered). Newman projeksiyonu.'],
  ['Katilma (Zincir) Polimerlesmesi: Doymamis monomerlerin (C=C) radikal ile acilarak zincir olusturmasi. Orn: PE (polietilen), PP, PVC. Polimerizasyon derecesi n=1000-100000.','Yogunlasma (Basamak) Polimerlesmesi: Iki farkli fonksiyonel grubun su, metanol gibi kucuk molekul cikararak reaksiyonu. Orn: Nylon 6,6, Polyester.','Termoplastik: Dogrusal/dallanmis zincirler, zayif van der Waals kuvvetleri. Isitilinca yumusar, tekrar islenebilir. Orn: PE, PP, PVC, PS.','Termoset: Capraz bagli 3D ag yapisi. Bir kez sertlesir, tekrar erimez. Yksek sicaklik dayanimi. Orn: Bakalit, Epoksi.','Elastomer (Kaucuk): Zayif capraz bagli zincirler. Gerilimde uzar, birakinca eski haline doner. Dogal kaucuk: izopren. Vulkanizasyon.'],
  ['Petrolun Bilesimi: C1-C60+ hidrokarbon karisimi. Fraksiyonel damitma ile ayrilir: Gaz(C1-C4), Benzin(C5-C9), Gaz yagi(C10-C13), Dizel(C14-C18), Yakit(C19-C25), Asfalt(>C25).','Alkanlar: CnH2n+2, C-C tek bag. Metan(CH4), Etan(C2H6), Propan(C3H8), Butan(C4H10). Karbon sayisi arttikca kaynama noktasi yukselir.','Kraking: Uzun zincir -> kisa zincir (benzin) + alken. Isi 500C veya katalitik (zeolit). Petrokimyanin temeli.','Reforming: Duz zincirli alkan -> halkali/aromatik HC. Oktan sayisi artar. Pt/Re katalizor, 500C. Benzin kalitesi yukselir.','Petrokimya Urunleri: Benzin(tasit), Plastik(ambalaj), Asfalt(yol), Gubre(tarim), Ilac(saglik), Polyester(tekstil).'],
  ['Karbonhidratlar: Cn(H2O)n - sekerler, nisasta, seluloz. Glikoz(C6H12O6), Fruktoz. Disakkarit: Sakkaroz(seker). Polisakkarit: Nisasta, Glikojen, Seluloz.','Proteinler: Amino asitlerden olusur. 20 cesit amino asit. Peptid bagi (-CO-NH-) ile baglanir. Birincil, ikincil, ucuncul yapi. Enzimler protein.','Yaglar (Lipitler): Gliserol + 3 yag asidi (trigliserid). Doymus yag(kati), doymamis yag(sivi). Hucre zari fosfolipitlerinden olusur. Steroidler.','Vitaminler: Organik bilesikler, metabolizmada duzenleyici. Yagda cozunen (A,D,E,K) ve suda cozunen (C,B kompleks). Eksikliginde hastalik.','Nukleik Asitler (DNA/RNA): Nukleotidlerden olusur (fosfat+seker+baz). DNA cift sarmal, RNA tek zincir. Genetik bilgi tasir.'],
  ['Redoks Analizi: Iki elementin elektronegatiflik (EN) degerlerini karsilastirarak elektron transferini belirleme. EN dusuk olan elektron verir (yukseltgenir), EN yuksek olan elektron alir (indirgenir).']
];
var BTN_NAMES = [
  ['SN2','Katilma','Ayrilma','Yukselt.','Indirgen.','SN1'],
  ['Yapi','Geometrik','Optik','Tautomeri','Konformasyon'],
  ['Katilma','Yogunlasma','Termoplastik','Termoset','Elastomer'],
  ['Bilesim','Alkanlar','Kraking','Reforming','Urunler'],
  ['Karbohidrat','Protein','Yag','Vitamin','Nukleik Asit'],
  ['Redoks']
];

function initBtns() {
  for (var i = 0; i < 6; i++) {
    (function(idx){
      var cont = document.getElementById('b'+idx);
      BTN_NAMES[idx].forEach(function(n,j){
        var b = document.createElement('button');
        b.textContent = n;
        b.addEventListener('click',function(){
          document.querySelectorAll('#b'+idx+' button').forEach(function(x){x.classList.remove('sel')});
          b.classList.add('sel'); cur[idx] = j; drawTab(idx);
        });
        cont.appendChild(b);
      });
      if (BTN_NAMES[idx].length > 0) {
        cont.firstChild && cont.firstChild.classList.add('sel');
      }
    })(i);
  }
  // Redox presets
  var rp = document.getElementById('rp');
  [['Na','Cl'],['H','O'],['C','O'],['H','F'],['K','Br'],['Li','F'],['N','O'],['Mg','O'],['S','O'],['Ca','F'],['Si','O'],['Al','O']].forEach(function(p){
    var b = document.createElement('button'); b.textContent = p[0]+'-'+p[1];
    b.addEventListener('click',function(){document.getElementById('rx1').value=p[0];document.getElementById('rx2').value=p[1];doRedox()});
    rp.appendChild(b);
  });
  document.getElementById('rxb').addEventListener('click',doRedox);
}
initBtns();

function drawAll(){for(var i=0;i<6;i++)drawTab(i)}

function drawTab(idx) {
  var cv = document.getElementById('c'+idx);
  cv.width = Math.min(cv.parentElement.getBoundingClientRect().width - 12, 600);
  var c = cv.getContext('2d'), w = cv.width, h = cv.height;
  bg(c); var i = cur[idx];
  
  function d(x,y,e,p,s){at(c,x,y,e,p||'#6B6B6B',s||'#444')}
  function b(x1,y1,x2,y2,t){bl(c,x1,y1,x2,y2,t)}
  
  if (idx === 0) drawReactions(c,w,h,i,d,b);
  else if (idx === 1) drawIsomer(c,w,h,i,d,b);
  else if (idx === 2) drawPolymer(c,w,h,i);
  else if (idx === 3) drawPetrol(c,w,h,i);
  else if (idx === 4) drawBio(c,w,h,i,d,b);
  else if (idx === 5) drawRedox(c,w,h);
  
  document.getElementById('d'+idx).innerHTML = '<b>' + BTN_NAMES[idx][i] + '</b>: ' + INFOS[idx][i] || INFOS[idx][0];
}

function drawReactions(c,w,h,i,d,b) {
  ar = Math.min(w*0.035, h*0.05, 24); sp = ar*4; cx = w/2;
  if (i===0) {
    var my = h*0.42;
    tx(c,'Yer Degistirme (SN2)',cx,h*0.08,'#00F0FF',h*0.06);
    tx(c,'Nu: + R-L -> R-Nu + L:',cx,h*0.15,'#E6EDF3',h*0.04);
    d(cx-sp*1.2,my,'OH','#FF0000'); d(cx-sp*0.3,my-sp*0.4,'H','#FFF');
    d(cx+sp*0.3,my,'C'); d(cx+sp*1.4,my,'Cl','#1FC01F');
    b(cx-sp*1.2,my,cx,my); b(cx,my,cx+sp*0.3,my); b(cx+sp*0.3,my,cx+sp*1.4,my);
    b(cx,my,cx-sp*0.3,my-sp*0.4);
    arr(c,cx+sp*0.5,my-sp*0.8,cx-sp*0.8,my+sp*1.0,'#FF69B4');
    tx(c,'Nu atagi (OH-)',cx+sp*0.5,my-sp*1.2,'#FF69B4',h*0.035);
    tx(c,'Ayrilan grup (Cl-)',cx+sp*1.8,my+sp*0.6,'#FFA500',h*0.035);
    tx(c,'Tek basamakli, eszamanli bag olusum/kopma',cx,h*0.88,'#AAA',h*0.035);
  } else if (i===1) {
    tx(c,'Katilma (Elektrofilik)',cx,h*0.08,'#00F0FF',h*0.06);
    tx(c,'C=C + HX -> C-C (H ve X eklenir)',cx,h*0.15,'#E6EDF3',h*0.04);
    var my = h*0.40;
    d(cx-sp*0.6,my,'C'); d(cx+sp*0.6,my,'C');
    d(cx-sp*1.3,my,'H','#FFF'); d(cx+sp*1.3,my,'Br','#A52525');
    b(cx-sp*0.6,my,cx+sp*0.6,my,2); b(cx-sp*0.6,my,cx-sp*1.3,my); b(cx+sp*0.6,my,cx+sp*1.3,my);
    tx(c,'C=C cift bagi',cx,my-sp*0.6,'#00F0FF',h*0.03);
    arr(c,cx+sp*0.2,my-sp*0.4,cx-sp*0.2,my+sp*0.4,'#FF69B4');
    tx(c,'p elektronlari H+ yi ceker',cx,my-sp*1.0,'#FF69B4',h*0.03);
    var my2 = h*0.78;
    d(cx-sp*0.6,my2,'C'); d(cx+sp*0.6,my2,'C'); d(cx-sp*1.3,my2,'H','#FFF'); d(cx+sp*1.3,my2,'Br','#A52525');
    b(cx-sp*0.6,my2,cx+sp*0.6,my2); b(cx-sp*0.6,my2,cx-sp*1.3,my2); b(cx+sp*0.6,my2,cx+sp*1.3,my2);
    tx(c,'Urun: H ve Br eklenmis alkan',cx,my2+sp*0.8,'#39FF14',h*0.035);
    tx(c,'Markovnikov: H cok H li C ye gider',cx,h*0.93,'#AAA',h*0.03);
  } else if (i===2) {
    tx(c,'Ayrilma (Eliminasyon)',cx,h*0.08,'#00F0FF',h*0.06);
    tx(c,'Alkol + H+ -> Alken + H2O',cx,h*0.15,'#E6EDF3',h*0.04);
    var my = h*0.45;
    d(cx-sp*0.6,my,'C'); d(cx+sp*0.6,my,'C'); d(cx+sp*1.4,my,'C');
    d(cx+sp*1.3,my-sp*0.4,'OH','#FF0000'); d(cx-sp*1.3,my,'H','#FFF');
    b(cx-sp*0.6,my,cx+sp*0.6,my); b(cx+sp*0.6,my,cx+sp*1.4,my);
    b(cx+sp*1.4,my,cx+sp*1.3,my-sp*0.4); b(cx-sp*0.6,my,cx-sp*1.3,my);
    tx(c,'+ H+ (asit katalizoru)',cx,my+sp*0.9,'#FFA500',h*0.035);
    arr(c,cx,h*0.58,cx,h*0.65,'#39FF14');
    var my2 = h*0.72;
    d(cx-sp*0.6,my2,'C'); d(cx+sp*0.6,my2,'C'); d(cx-sp*1.3,my2,'H','#FFF');
    b(cx-sp*0.6,my2,cx+sp*0.6,my2,2); b(cx-sp*0.6,my2,cx-sp*1.3,my2);
    tx(c,'Alken + H2O',cx,my2+sp*0.7,'#39FF14',h*0.035);
  } else if (i===3) {
    tx(c,'Yukseltgenme (Alkol -> Keton/Asit)',cx,h*0.08,'#00F0FF',h*0.055);
    tx(c,'R-OH + [O] -> R=O + H2O',cx,h*0.15,'#E6EDF3',h*0.04);
    var my = h*0.40;
    d(cx-sp*0.8,my,'C'); d(cx+sp*0.4,my,'C'); d(cx-sp*0.8,my-sp*0.5,'H','#FFF');
    d(cx+sp*0.4,my-sp*0.5,'OH','#FF0000'); d(cx-sp*0.8,my+sp*0.5,'H','#FFF'); d(cx+sp*0.4,my+sp*0.5,'H','#FFF');
    b(cx-sp*0.8,my,cx+sp*0.4,my); b(cx-sp*0.8,my,cx-sp*0.8,my-sp*0.5);
    b(cx-sp*0.8,my,cx-sp*0.8,my+sp*0.5); b(cx+sp*0.4,my,cx+sp*0.4,my-sp*0.5); b(cx+sp*0.4,my,cx+sp*0.4,my+sp*0.5);
    tx(c,'Icin Alkol (R-CH2-OH)',cx,my+sp*0.9,'#AAA',h*0.03);
    tx(c,'+ [O] (Cr2O7/H2SO4)',cx,h*0.62,'#FFA500',h*0.03);
    arr(c,cx,h*0.65,cx,h*0.70,'#39FF14');
    var my2 = h*0.78;
    d(cx-sp*0.8,my2,'C'); d(cx+sp*0.4,my2,'C');
    d(cx-sp*0.8,my2-sp*0.5,'H','#FFF'); d(cx-sp*0.8,my2+sp*0.5,'H','#FFF');
    d(cx+sp*0.4,my2-sp*0.5,'O','#FF0000');
    b(cx-sp*0.8,my2,cx+sp*0.4,my2,2); b(cx-sp*0.8,my2,cx-sp*0.8,my2-sp*0.5);
    b(cx-sp*0.8,my2,cx-sp*0.8,my2+sp*0.5);
    tx(c,'Keton (R-CO-R)',cx,my2+sp*0.8,'#39FF14',h*0.035);
  } else if (i===4) {
    tx(c,'Indirgenme (Keton/Asit -> Alkol)',cx,h*0.08,'#00F0FF',h*0.055);
    tx(c,'C=O + 2H -> CH-OH',cx,h*0.15,'#E6EDF3',h*0.04);
    var my = h*0.40;
    d(cx-sp*0.8,my,'C'); d(cx+sp*0.4,my,'C'); d(cx-sp*0.8,my-sp*0.5,'H','#FFF');
    d(cx-sp*0.8,my+sp*0.5,'H','#FFF'); d(cx+sp*0.4,my-sp*0.5,'O','#FF0000');
    b(cx-sp*0.8,my,cx+sp*0.4,my,2); b(cx-sp*0.8,my,cx-sp*0.8,my-sp*0.5); b(cx-sp*0.8,my,cx-sp*0.8,my+sp*0.5);
    tx(c,'Keton',cx,my+sp*0.8,'#AAA',h*0.03);

function drawRedox(c,w,h) {

    return;

  var d1 = EL[e1.charAt(0).toUpperCase()+e1.slice(1).toLowerCase()];
  var d2 = EL[e2.charAt(0).toUpperCase()+e2.slice(1).toLowerCase()];
  // try direct
  if (!d1) { var k = Object.keys(EL).find(function(x){return x===e1.toUpperCase()}); if(k)d1=EL[k] }

      tx(c,'(en dusukten yuksege)',cx,arrowY+h*0.045+2,'#8B949E',h*0.035);
    } else {
      arr(c,rx2-r-5,cy,cx,arrowY,'#00F0FF'); arr(c,cx,arrowY,lx+r+5,cy,'#00F0FF');
      tx(c,'e- akisi (yukseltgenme)',cx,arrowY-10,'#CCCCCC',h*0.04);
      tx(c,'(en dusukten yuksege)',cx,arrowY+h*0.045+2,'#8B949E',h*0.035);
    }
    var ay2 = cy + r + h*0.045 + 16;
    var yu = en1 < en2 ? e1.toUpperCase() : e2.toUpperCase();
    var ind = en1 > en2 ? e1.toUpperCase() : e2.toUpperCase();
    c.font = h*0.05+'px sans-serif'; c.fillStyle='#39FF14'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('Yukseltgenen: '+yu+' (e- verir)', lx, ay2);
    c.fillText('Indirgenen: '+ind+' (e- alir)', rx2, ay2);
    
    // EN Bar
    var barY = h*0.72, barH = 24, barL = w*0.08, barR2 = w*0.92, barW = barR2 - barL;
    c.fillStyle = '#1E2A3A'; roundRect(c, barL, barY, barW, barH, 12);
    var grd = c.createLinearGradient(barL,0,barR2,0); grd.addColorStop(0,'#39FF14'); grd.addColorStop(0.33,'#00F0FF'); grd.addColorStop(0.66,'#FF0080'); grd.addColorStop(1,'#FF3333');
    c.fillStyle = grd; roundRect(c, barL, barY, barW, barH, 12);
    var maxEn = 4.0, p1 = en1/maxEn, p2 = en2/maxEn, m1X = barL + barW * p1, m2X = barL + barW * p2;
    circ(c, m1X, barY+barH/2, 10, '#FFF');
    c.font = h*0.035+'px sans-serif'; c.fillStyle='#FFA500'; c.fillText(e1.toUpperCase()+' '+rnd(en1,1), m1X, barY-8);
    circ(c, m2X, barY+barH/2, 10, '#FFF');
    c.fillText(e2.toUpperCase()+' '+rnd(en2,1), m2X, barY-8);
    c.font = h*0.04+'px sans-serif'; c.fillStyle='#39FF14'; c.fillText('Dusuk EN (e- verir)', barL, barY+barH+28);
    c.fillText('Yuksek EN (e- alir)', barR2, barY+barH+28);
    c.font = h*0.04+'px sans-serif'; c.fillStyle='#CCCCCC';
    c.fillText('EN Farki: '+rnd(fark,2)+' | '+bag, cx, barY+barH+52);
    
    var html = '<div class="l">REDOKS ANALIZI</div>';
    html += '<div>'+d1.n+' ('+e1.toUpperCase()+', EN: '+en1+') - '+d2.n+' ('+e2.toUpperCase()+', EN: '+en2+')</div>';
    html += '<div class="v">EN Farki: '+rnd(fark,2)+' | Bag: '+bag+'</div>';
    html += '<div>Yukseltgenen: '+(en1<en2?d1.n:d2.n)+' (e- verir, EN dusuk)</div>';
    html += '<div>Indirgenen: '+(en1>en2?d1.n:d2.n)+' (e- alir, EN yuksek)</div>';
    html += '<div class="l" style="margin-top:6px">Yukseltgenme: '+(en1<en2?e1:e2).toUpperCase()+' -> '+(en1<en2?e1:e2).toUpperCase()+'+ + e-</div>';
    html += '<div class="l">Indirgenme: '+(en1>en2?e1:e2).toUpperCase()+' + e- -> '+(en1>en2?e1:e2).toUpperCase()+"-</div>";
    document.getElementById('rxt').innerHTML = html;
  }
}

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fill()}

function doRedox() {
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('act')});
  document.querySelectorAll('.tab')[5].classList.add('act');
  document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('act')});
  document.getElementById('t5').classList.add('act');
  setTimeout(function(){var cv=document.getElementById('c5');cv.width=Math.min(cv.parentElement.getBoundingClientRect().width-12,600);drawRedox(cv.getContext('2d'),cv.width,cv.height)},50);
}

// Auto-run
setTimeout(drawAll, 100);
</script>
